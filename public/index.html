<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#6441a5" />
    <title>%PAGE_TITLE%</title>
    <link rel="apple-touch-icon" sizes="180x180" href="%FAVICON_URL%" />
    <link rel="icon" type="image/png" sizes="32x32" href="%FAVICON_URL%" />
    <link rel="icon" type="image/png" sizes="16x16" href="%FAVICON_URL%" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div id="toast" class="toast"></div>
    <div class="header">
      <h1>BookDub Streamer Notification Management</h1>
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>

    <div class="add-form">
      <h2>Add New Streamer</h2>
      <input type="text" id="newStreamerName" placeholder="Streamer name" />
      <input
        type="text"
        id="newGoingLiveMessage"
        placeholder="Going live message"
      />
      <button onclick="addStreamer()">Add Streamer</button>
    </div>

    <div class="streamer-list" id="streamerList">
      <!-- Streamers will be loaded here -->
    </div>

    <script src="/js/main.js"></script>
  </body>
</html>
